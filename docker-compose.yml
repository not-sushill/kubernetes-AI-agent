version: "3.9"

services:

  postgres:
    image: postgres:17

    container_name: ai-k8s-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_k8s_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_k8s_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ai-network

volumes:

  postgres_data:

networks:

  ai-network: